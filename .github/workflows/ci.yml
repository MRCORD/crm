name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Dummy values so the build succeeds without real secrets.
          # Server Actions and pages are force-dynamic, so this only
          # needs to satisfy build-time module evaluation, not runtime.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy_build_key_00000000000000000000000
          CLERK_SECRET_KEY: sk_test_dummy_build_key_00000000000000000000000
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/crm
