name: Bug Report
description: Report a reproducible bug in Agentic CRM
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "e.g. main @ a3bab31, or a tagged release"
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment target
      options:
        - Cloudflare Workers
        - Docker / Self-hosted Node.js
        - Local dev (next dev)
        - Other
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Redact any credentials or personal data.
      render: shell
    validations:
      required: false
