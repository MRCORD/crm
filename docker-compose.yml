# One-command local PostgreSQL for development.
#
# Usage:
#   docker compose up -d
#   pnpm db:migrate
#   pnpm dev
#
# This matches the default DATABASE_URL in .env.example:
#   postgres://postgres:postgres@localhost:5432/crm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - agentic-crm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentic-crm-postgres-data:
